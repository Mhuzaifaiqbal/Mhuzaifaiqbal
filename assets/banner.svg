<svg width="1500" height="500" viewBox="0 0 1500 500" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" font-family="'SF Pro Display','SF Pro Text',-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',system-ui,'Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#060A12"/>
      <stop offset="0.55" stop-color="#0A1220"/>
      <stop offset="1"   stop-color="#0C1728"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="47%" r="48%">
      <stop offset="0"   stop-color="#3E92E6" stop-opacity="0.50"/>
      <stop offset="34%" stop-color="#1E5BA6" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#060A12" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="46%" r="24%">
      <stop offset="0"   stop-color="#CBE8FF" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#CBE8FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ember" cx="63%" cy="80%" r="42%">
      <stop offset="0"   stop-color="#F5893E" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#F5893E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#F2FAFF"/>
      <stop offset="1"   stop-color="#BFE1FF"/>
    </linearGradient>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="textGlow" x="-40%" y="-60%" width="180%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="noise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.04"/></feComponentTransfer>
    </filter>
    <radialGradient id="vignette" cx="50%" cy="50%" r="72%">
      <stop offset="58%"  stop-color="#04060C" stop-opacity="0"/>
      <stop offset="100%" stop-color="#04060C" stop-opacity="0.38"/>
    </radialGradient>

    <!-- All glowing tech linework, defined once -->
    <g id="tech">
      <g fill="none" stroke-linecap="round" stroke-linejoin="round">
        <g stroke="#29B6FF" stroke-width="1.5" opacity="0.6">
          <path d="M0,120 H150 L210,180 H360"/>
          <path d="M0,300 H80 V360 H240"/>
          <path d="M0,430 H180 L240,390 H366"/>
          <path d="M0,250 H60 L110,250"/>
          <path d="M1500,140 H1360 L1300,200 H1150"/>
          <path d="M1500,330 H1380 L1320,272 H1180"/>
          <path d="M1500,415 H1320 L1260,360 H1120"/>
          <path d="M1500,235 H1430 L1400,235"/>
        </g>
        <g stroke="#F5893E" stroke-width="1.5" opacity="0.55">
          <path d="M0,180 H110 L170,240 H320"/>
          <path d="M1500,300 H1400 V360 H1240"/>
        </g>
      </g>
      <g fill="#29B6FF" opacity="0.85">
        <rect x="356" y="176" width="8" height="8" rx="1.5"/>
        <rect x="236" y="356" width="8" height="8" rx="1.5"/>
        <rect x="362" y="386" width="8" height="8" rx="1.5"/>
        <rect x="1146" y="196" width="8" height="8" rx="1.5"/>
        <rect x="1176" y="268" width="8" height="8" rx="1.5"/>
        <rect x="1116" y="356" width="8" height="8" rx="1.5"/>
      </g>
      <g fill="none" stroke="#6FD6FF" stroke-width="1.4" opacity="0.8">
        <circle cx="110" cy="250" r="4"/>
        <circle cx="1400" cy="235" r="4"/>
      </g>
      <g fill="#F5893E" opacity="0.8">
        <rect x="316" y="236" width="8" height="8" rx="1.5"/>
        <rect x="1236" y="356" width="8" height="8" rx="1.5"/>
      </g>
      <g>
        <circle cx="470" cy="150" r="2.4" fill="#EAF6FF" opacity="0.9"/>
        <circle cx="1050" cy="360" r="2.2" fill="#9FD8FF" opacity="0.85"/>
        <circle cx="980" cy="120" r="1.8" fill="#EAF6FF" opacity="0.8"/>
        <circle cx="420" cy="380" r="1.8" fill="#9FD8FF" opacity="0.8"/>
      </g>
    </g>
  </defs>

  <rect width="1500" height="500" fill="url(#bg)"/>
  <rect width="1500" height="500" fill="url(#ember)"/>
  <rect width="1500" height="500" fill="url(#aura)"/>
  <rect width="1500" height="500" fill="url(#core)"/>

  <!-- glow underlay + crisp overlay -->
  <use xlink:href="#tech" filter="url(#soft)" opacity="0.9"/>
  <use xlink:href="#tech"/>

  <rect width="1500" height="500" filter="url(#noise)"/>
  <rect width="1500" height="500" fill="url(#vignette)"/>

  <g text-anchor="middle" text-rendering="geometricPrecision">
    <text x="750" y="246" fill="#2FA5FF" opacity="0.55" font-size="76" font-weight="700" letter-spacing="-1.2" filter="url(#textGlow)">Muhammad Huzaifa Iqbal</text>
    <text x="750" y="246" fill="url(#ink)" font-size="76" font-weight="700" letter-spacing="-1.2">Muhammad Huzaifa Iqbal</text>
    <line x1="722" y1="278" x2="778" y2="278" stroke="#4FC3F7" stroke-width="1.4" opacity="0.6"/>
    <text x="750" y="312" fill="#9CBBDD" font-size="25" font-weight="500" letter-spacing="3.5">Computer Science Student</text>
    <text x="750" y="352" font-size="17" font-weight="500" letter-spacing="3.2"><tspan fill="#8AA6C6">AI</tspan><tspan fill="#F5893E">  &#8226;  </tspan><tspan fill="#8AA6C6">Cybersecurity</tspan><tspan fill="#F5893E">  &#8226;  </tspan><tspan fill="#8AA6C6">Full Stack Development</tspan></text>
  </g>
</svg>
